    <!-- Compatibility shield for browser extension fetch interceptors -->
    <script>
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch || _origFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() { return _currentFetch || _origFetch; },
                set: function(fn) { _currentFetch = fn; }
              });
            }
          } catch (err) {}
        }

        window.addEventListener('error', function(event) {
          if (
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 ||
             event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
